id: npa-antioch-openpi-franka
name: NPA Antioch OpenPI Franka camera bridge
scenario_paths: [scenarios.py]

services:
  sim:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPA_SOURCE_REF: 4fca6f4588b29f591a0ea34ee3a58e70a88f3e45
    environment:
      OPENPI_POLICY_HOST: 127.0.0.1
      OPENPI_POLICY_PORT: "8000"
    ports:
      - "18123:18123"

suites:
  openpi_franka_smoke:
    description: Run the two-camera Franka bridge against a private OpenPI service.
    select:
      - tags: [npa-openpi-franka]
