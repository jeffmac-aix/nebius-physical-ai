# Replace this local-only placeholder with the operator's assigned Antioch
# project ID before dispatch. Never commit a live project or machine ID.
id: "replace-at-runtime"
name: "npa-openpi-live"
scenario_paths: ["src/scenario.py"]

services:
  sim:
    build:
      context: "."
      dockerfile: "Dockerfile"
    ports:
      # Antioch publishes this only on the operator's localhost while services
      # are up. The scenario terminates authenticated TLS here; the supervised
      # operator relay carries the other verified WSS leg to the B200 gateway.
      - name: policy-relay
        target: 8444
        published: 18444
    watch:
      - action: rebuild
        path: Dockerfile

suites:
  live:
    description: "Continuing Franka camera-to-policy live demonstration"
    select:
      - tags: ["openpi-live"]
