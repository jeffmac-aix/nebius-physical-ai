# OpenPI full-DROID image compatibility on eight reserved one-GPU RTX PRO nodes.
name: byof-solution-smoke-openpi-rtxpro8-gpu
execution: serial
---
name: byof-solution-smoke-openpi-rtxpro8-gpu
resources:
  cloud: kubernetes
  accelerators: RTXPRO6000:1
  cpus: 20+
  memory: 180+
  disk_size: 100
  num_nodes: 8
  image_id: "docker:<your-registry>/<namespace>/npa-byof:<your-run-id>"
envs:
  NPA_BYOF_RUN_ID: "<your-run-id>"
  BYOF_REPO_ROOT: "/opt/byof"
  BYOF_SMOKE_COMMAND: ""
  BYOF_SOLUTION_NAME: ""
  BYOF_CAPABILITY_NAME: ""
  BYOF_SMOKE_ARTIFACT_NAME: ""
  BYOF_IMAGE: ""
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
  S3_OUTPUT_PREFIX: "s3://${NPA_S3_BUCKET}/byof/${NPA_BYOF_RUN_ID}/"
  AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL}"
setup: |
  set -euo pipefail
  test -d "${BYOF_REPO_ROOT}"
  test -f "${BYOF_REPO_ROOT}/npa_source_metadata.json"
  test -f "${BYOF_REPO_ROOT}/npa_build_metadata.json"
  test -x /usr/local/bin/npa-openpi-sm120-probe
  python3 - <<'PY' || python3 -m pip install --quiet --break-system-packages boto3 || python3 -m pip install --quiet boto3
  import boto3
  PY
run: |
  set -euo pipefail
  RANK="${SKYPILOT_NODE_RANK:?missing SkyPilot node rank}"
  OUTPUT_DIR="/workspace/byof-runs/${NPA_BYOF_RUN_ID}/rank-${RANK}"
  mkdir -p "${OUTPUT_DIR}"
  export NPA_SMOKE_OUTPUT_DIR="${OUTPUT_DIR}"
  cp "${BYOF_REPO_ROOT}/npa_source_metadata.json" "${OUTPUT_DIR}/npa_source_metadata.json"
  nvidia-smi > "${OUTPUT_DIR}/nvidia_smi.txt" 2>&1
  nvidia-smi -L > "${OUTPUT_DIR}/nvidia_smi_list.txt" 2>&1
  SMOKE_EXIT_CODE=0
  set +e
  (
    cd "${BYOF_REPO_ROOT}"
    /bin/bash -lc "${BYOF_SMOKE_COMMAND}"
  ) > "${OUTPUT_DIR}/solution_smoke_stdout.log" 2> "${OUTPUT_DIR}/solution_smoke_stderr.log"
  SMOKE_EXIT_CODE=$?
  set -e
  if [ "${SMOKE_EXIT_CODE}" -eq 0 ] && [ "${RANK}" -eq 0 ]; then
    test -f "${OUTPUT_DIR}/${BYOF_SMOKE_ARTIFACT_NAME}"
  fi
  export SMOKE_EXIT_CODE
  if [ "${RANK}" -ne 0 ]; then
    exit "${SMOKE_EXIT_CODE}"
  fi
  python3 <<'PY'
  import json
  import os
  from pathlib import Path
  from urllib.parse import urlparse

  import boto3
  from botocore.config import Config

  run_id = os.environ["NPA_BYOF_RUN_ID"]
  root = Path(f"/workspace/byof-runs/{run_id}/rank-0")
  summary = {
      "status": "success" if int(os.environ["SMOKE_EXIT_CODE"]) == 0 else "failed",
      "tool": "byof",
      "workload": "solution-smoke-openpi-rtxpro8",
      "run_id": run_id,
      "image": os.environ.get("BYOF_IMAGE", ""),
      "solution_name": os.environ.get("BYOF_SOLUTION_NAME", ""),
      "capability_name": os.environ.get("BYOF_CAPABILITY_NAME", ""),
      "smoke_artifact_name": os.environ.get("BYOF_SMOKE_ARTIFACT_NAME", ""),
      "smoke_exit_code": int(os.environ["SMOKE_EXIT_CODE"]),
  }
  (root / "npa_byof_summary.json").write_text(json.dumps(summary, indent=2) + "\n")
  parsed = urlparse(os.environ["S3_OUTPUT_PREFIX"].rstrip("/") + "/")
  endpoint = (os.environ.get("AWS_ENDPOINT_URL") or os.environ.get("NEBIUS_S3_ENDPOINT") or "").strip() or None
  kwargs = {
      "endpoint_url": endpoint,
      "config": Config(s3={"addressing_style": "path"}),
      "region_name": os.environ.get("AWS_DEFAULT_REGION", "us-central1"),
  }
  if os.environ.get("AWS_ACCESS_KEY_ID") and os.environ.get("AWS_SECRET_ACCESS_KEY"):
      kwargs["aws_access_key_id"] = os.environ["AWS_ACCESS_KEY_ID"]
      kwargs["aws_secret_access_key"] = os.environ["AWS_SECRET_ACCESS_KEY"]
  s3 = boto3.client("s3", **kwargs)
  prefix = parsed.path.lstrip("/")
  for path in root.rglob("*"):
      if path.is_file():
          s3.put_object(
              Bucket=parsed.netloc,
              Key=prefix + path.relative_to(root).as_posix(),
              Body=path.read_bytes(),
              IfNoneMatch="*",
          )
  s3.head_object(Bucket=parsed.netloc, Key=prefix + "npa_byof_summary.json")
  PY
  if [ "${SMOKE_EXIT_CODE}" -ne 0 ]; then
    exit "${SMOKE_EXIT_CODE}"
  fi
