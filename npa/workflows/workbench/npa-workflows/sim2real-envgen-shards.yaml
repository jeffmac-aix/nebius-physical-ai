apiVersion: npa.workflow/v0.0.1
kind: Workflow

# npa.workflow twin of the retired skypilot/sim2real-envgen-split.yaml.
#
# The template was a single task that read its shard index from Kubernetes' Job completion
# index (`--shard-index "${JOB_COMPLETION_INDEX:-0}"`), so producing N shards meant submitting
# it N times, or relying on an indexed Job the workflow surface never modelled. Here the
# fan-out is declared: a `parallel:` group whose members differ only through `params:`, which
# the renderer emits as one SkyPilot JobGroup. `split` is the barrier that only runs once
# every shard reached a terminal state, and it writes the 80/20 train/held-out manifest the
# template's name promised.
#
#   npa workbench workflow submit sim2real-envgen-shards.yaml --run-id <id> --runtime \
#     --secret-env AWS_ACCESS_KEY_ID --secret-env AWS_SECRET_ACCESS_KEY
#
# CPU on purpose: env-shard generation writes a catalog of environment descriptors, it does
# not render. The template asked for RTXPRO6000:1, which the work never used.

metadata:
  name: sim2real-envgen-shards
  description: >
    Sim2Real raw environment generation sharded across concurrent workers, then an
    80/20 train/held-out split over the combined catalog.
  skypilotTwin: npa/src/npa/workflows/skypilot/sim2real-envgen-split.yaml

config:
  bucket: example-bucket
  prefix: "sim2real-envgen/{{run.id}}"

  env_count: "64"
  shard_count: "2"
  train_fraction: "0.8"
  envgen_seed: "42"
  # Optional Cosmos-augmented frame set to condition generation on; empty means none.
  augmented_frames_uri: ""

  # Overridden per shard by the `params:` block of each parallel member.
  shard_index: "0"

  raw_envs_uri: "s3://{{config.bucket}}/{{config.prefix}}/raw-envs/"
  splits_uri: "s3://{{config.bucket}}/{{config.prefix}}/splits/"

resources:
  cpu:
    cloud: kubernetes
    cpus: 4
    memory: 16Gi

initial: generate-shards

states:
  generate-shards:
    description: Two raw env shards generated concurrently as one JobGroup.
    parallel:
      - shard-0
      - shard-1
    maxConcurrency: "{{config.shard_count}}"
    next: split

  shard-0:
    description: Raw env shard 0.
    resources: cpu
    params:
      shard_index: "0"
    toolRef: workbench.sim2real_envgen.raw_shard
    outputs:
      - uri: "{{config.raw_envs_uri}}"
        schema: npa.sim2real.raw_envs.v1

  shard-1:
    description: Raw env shard 1.
    resources: cpu
    params:
      shard_index: "1"
    toolRef: workbench.sim2real_envgen.raw_shard
    outputs:
      - uri: "{{config.raw_envs_uri}}"
        schema: npa.sim2real.raw_envs.v1

  split:
    description: 80/20 train/held-out split over the combined shard catalog.
    needs: [generate-shards]
    resources: cpu
    toolRef: workbench.sim2real_envgen.split
    outputs:
      - uri: "{{config.splits_uri}}split.json"
        schema: npa.sim2real.split_manifest.v1
    terminal: true
