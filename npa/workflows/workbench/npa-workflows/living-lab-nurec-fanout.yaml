apiVersion: npa.workflow/v0.0.1
kind: Workflow
metadata:
  name: living-lab-nurec-fanout
  description: 'Sixteen-zone living-lab digital twin from real NVIDIA NuRec / NRE neural reconstructions:
    16 independent RTX PRO 6000 shards (8 real NCore sequences x 2 view sectors) each run the full nurec
    pipeline, then a barrier join composes a composite digital-twin report and contact-sheet panorama
    with objective per-zone GPU participation evidence.'
config:
  bucket: example-bucket
  prefix: living-lab/{{run.id}}
  nurec_image: nvcr.io/nvidia/nre/nre-ga:26.04
  dataset_id: nvidia/PhysicalAI-NuRec-PPISP
  max_concurrency: '16'
  zones: huerstholz-auto-a,huerstholz-auto-b,huerstholz-standard-a,huerstholz-standard-b,struktur28-auto-a,struktur28-auto-b,struktur28-standard-a,struktur28-standard-b,toro-auto-a,toro-auto-b,toro-standard-a,toro-standard-b,valiant-auto-a,valiant-auto-b,valiant-standard-a,valiant-standard-b
  run_prefix_uri: s3://{{config.bucket}}/{{config.prefix}}/
  zones_uri: s3://{{config.bucket}}/{{config.prefix}}/zones/
  report_uri: s3://{{config.bucket}}/{{config.prefix}}/reports/digital_twin.json
  panorama_uri: s3://{{config.bucket}}/{{config.prefix}}/reports/panorama.png
  zone_name: ''
resources:
  gpu:
    cloud: kubernetes
    accelerators: RTXPRO-6000-BLACKWELL-SERVER-EDITION:1
    cpus: 8
    memory: 64Gi
    image: '{{config.nurec_image}}'
    kubernetes:
      provision_timeout: 2400
      pod_config:
        spec:
          imagePullSecrets:
          - name: ngc-nvcr-imagepullsecret
          initContainers:
          - name: npa-sudo-shim
            image: '{{config.nurec_image}}'
            command:
            - /bin/sh
            - -c
            - 'printf ''#!/bin/sh\nexec "$@"\n'' > /shim/sudo

              chmod 0755 /shim/sudo

              '
            volumeMounts:
            - name: npa-sudo-shim
              mountPath: /shim
          containers:
          - name: ray-node
            volumeMounts:
            - name: npa-sudo-shim
              mountPath: /usr/local/sbin
            - name: dshm
              mountPath: /dev/shm
          volumes:
          - name: npa-sudo-shim
            emptyDir: {}
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi
  cpu:
    cloud: kubernetes
    cpus: 4
    memory: 16Gi
initial: living-lab-zones
states:
  living-lab-zones:
    description: Fan out the 16 living-lab zone reconstructions as one SkyPilot JobGroup (one RTX PRO
      6000 each). Each member is a fully independent, real NRE reconstruction of its zone, so all sixteen
      reserved RTX PRO 6000 GPUs are materially busy at once.
    parallel:
    - zone-huerstholz-auto-a
    - zone-huerstholz-auto-b
    - zone-huerstholz-standard-a
    - zone-huerstholz-standard-b
    - zone-struktur28-auto-a
    - zone-struktur28-auto-b
    - zone-struktur28-standard-a
    - zone-struktur28-standard-b
    - zone-toro-auto-a
    - zone-toro-auto-b
    - zone-toro-standard-a
    - zone-toro-standard-b
    - zone-valiant-auto-a
    - zone-valiant-auto-b
    - zone-valiant-standard-a
    - zone-valiant-standard-b
    maxConcurrency: '{{config.max_concurrency}}'
    next: join
  zone-huerstholz-auto-a:
    description: 'Zone huerstholz-auto-a: full real NuRec/NRE reconstruction of the huerstholz auto capture
      (view sector a) on its own RTX PRO 6000, then novel-view render + Rerun recording.'
    resources: gpu
    params:
      zone_name: huerstholz-auto-a
      scene: huerstholz
      variant: auto
      view_sector: a
      rig_rotation_offset: 0,0,0
      rig_translation_offset: 0,0.25,0
    run:
      shell: "set -euo pipefail\nZONE=\"{{config.zone_name}}\"\nRUN_URI=\"{{config.run_prefix_uri}}\"\n\
        ZU=\"${RUN_URI}zones/${ZONE}/\"\nNC=\"${ZU}ncore/\"\nRC=\"${ZU}reconstruction/\"\nNV=\"${ZU}novel_views/\"\
        \nRRD=\"${ZU}reports/sim2real.rrd\"\nMF=\"${ZU}zone_manifest.json\"\nGPU_NAME=$(nvidia-smi --query-gpu=name\
        \ --format=csv,noheader | head -1 || echo unknown)\nSTART=$(date +%s)\nnpa workbench nurec check\
        \ --require-gpu --output json\nnpa workbench nurec fetch --output-uri \"${NC}\" --output json\
        \ >/tmp/nurec-fetch.json\nNCORE=$(python3 -c \"import json;print(json.load(open('/tmp/nurec-fetch.json')).get('ncore_json',''))\"\
        )\ntest -n \"${NCORE}\"\nnpa workbench nurec reconstruct --ncore-uri \"${NCORE}\" --config-name\
        \ \"configs/experimental/3dgut/3dgut_colmap.yaml\" --mode trainval --world-size 1 --image \"{{config.nurec_image}}\"\
        \ --export-gt --output-uri \"${RC}\" --input-uri \"${ZU}input/\" --output json >/tmp/nurec-reconstruct.json\n\
        USDZ=$(python3 -c \"import json;print(json.load(open('/tmp/nurec-reconstruct.json')).get('usdz_path',''))\"\
        )\nnpa workbench nurec render --artifact-uri \"${RC}\" --out-dir /tmp/render-out --renderer default\
        \ --rig-translation-offset \"{{config.rig_translation_offset}}\" --rig-rotation-offset \"{{config.rig_rotation_offset}}\"\
        \ --no-replicate-training-views --output-uri \"${NV}\" --output json >/tmp/nurec-render.json\n\
        npa workbench nurec visualize --input-uri \"${ZU}\" --output-uri \"${RRD}\" --output json >/tmp/nurec-viz.json\n\
        END=$(date +%s)\npython3 - <<'PY'\nimport json, os\ndef _load_json(path, default=None):\n    default\
        \ = default if default is not None else {}\n    try:\n        with open(path) as fh:\n       \
        \     return json.load(fh)\n    except Exception:\n        return default\nrecon = _load_json(\"\
        /tmp/nurec-reconstruct.json\")\nmetrics = recon.get(\"metrics\") or {}\npayload = {\n  \"schema\"\
        : \"npa.living_lab.zone_manifest.v1\",\n  \"zone_name\": os.environ[\"ZONE\"],\n  \"status\":\
        \ \"ok\",\n  \"gpu_name\": os.environ.get(\"GPU_NAME\", \"\"),\n  \"usdz_path\": os.environ.get(\"\
        USDZ\", \"\"),\n  \"reconstruction_uri\": os.environ.get(\"RC\", \"\"),\n  \"novel_views_uri\"\
        : os.environ.get(\"NV\", \"\"),\n  \"elapsed_seconds\": int(os.environ.get(\"END\", 0)) - int(os.environ.get(\"\
        START\", 0)),\n  \"metrics\": {\n    \"test/psnr\": metrics.get(\"test/psnr\", 0.0),\n    \"test/ssim\"\
        : metrics.get(\"test/ssim\", 0.0),\n    \"test/lpips\": metrics.get(\"test/lpips\", 0.0),\n  },\n\
        }\njson.dump(payload, open(\"/tmp/zone_manifest.json\", \"w\"))\nfrom npa.clients.storage import\
        \ StorageClient\nStorageClient.from_environment().upload_file(\"/tmp/zone_manifest.json\", os.environ[\"\
        MF\"])\nprint(json.dumps(payload))\nPY\n"
    outputs:
    - uri: '{{config.zones_uri}}{{config.zone_name}}/zone_manifest.json'
      schema: npa.living_lab.zone_manifest.v1
