        \ setup installs npa from $NPA_SRC_S3_URI; this step fills in\n# the NRE-runtime Python deps (nvidia-ncore\
        \ for fetch, rerun-sdk for the Rerun\n# recording, pillow/pyyaml for the join inputs) and ffmpeg\
