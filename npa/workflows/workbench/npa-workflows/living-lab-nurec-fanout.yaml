apiVersion: npa.workflow/v0.0.1
kind: Workflow
metadata:
  name: living-lab-nurec-fanout
  description: 'Sixteen-zone living-lab digital twin from real NVIDIA NuRec / NRE neural reconstructions:
    16 independent RTX PRO 6000 shards (8 real NCore sequences x 2 view sectors) each run the full nurec
    pipeline, then a barrier join composes a composite digital-twin report and contact-sheet panorama
    with objective per-zone GPU participation evidence.'
config:
  bucket: example-bucket
  prefix: living-lab/{{run.id}}
  nurec_image: nvcr.io/nvidia/nre/nre-ga:26.04
  dataset_id: nvidia/PhysicalAI-NuRec-PPISP
  max_concurrency: '16'
  zones: huerstholz-auto-a,huerstholz-auto-b,huerstholz-standard-a,huerstholz-standard-b,struktur28-auto-a,struktur28-auto-b,struktur28-standard-a,struktur28-standard-b,toro-auto-a,toro-auto-b,toro-standard-a,toro-standard-b,valiant-auto-a,valiant-auto-b,valiant-standard-a,valiant-standard-b
  run_prefix_uri: s3://{{config.bucket}}/{{config.prefix}}/
  zones_uri: s3://{{config.bucket}}/{{config.prefix}}/zones/
  report_uri: s3://{{config.bucket}}/{{config.prefix}}/reports/digital_twin.json
  panorama_uri: s3://{{config.bucket}}/{{config.prefix}}/reports/panorama.png
  zone_name: ''
resources:
  gpu:
    cloud: kubernetes
    accelerators: RTXPRO-6000-BLACKWELL-SERVER-EDITION:1
    cpus: 8
    memory: 64Gi
    image: '{{config.nurec_image}}'
    kubernetes:
      provision_timeout: 2400
      pod_config:
        spec:
          imagePullSecrets:
          - name: ngc-nvcr-imagepullsecret
          initContainers:
          - name: npa-sudo-shim
            image: '{{config.nurec_image}}'
            command:
            - /bin/sh
            - -c
            - 'printf ''#!/bin/sh\nexec "$@"\n'' > /shim/sudo

              chmod 0755 /shim/sudo

              '
            volumeMounts:
            - name: npa-sudo-shim
              mountPath: /shim
          containers:
          - name: ray-node
            volumeMounts:
            - name: npa-sudo-shim
              mountPath: /usr/local/sbin
            - name: dshm
              mountPath: /dev/shm
          volumes:
          - name: npa-sudo-shim
            emptyDir: {}
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi
  cpu:
    cloud: kubernetes
    cpus: 4
    memory: 16Gi
initial: living-lab-zones
states:
  living-lab-zones:
    description: Fan out the 16 living-lab zone reconstructions as one SkyPilot JobGroup (one RTX PRO
      6000 each). Each member is a fully independent, real NRE reconstruction of its zone, so all sixteen
      reserved RTX PRO 6000 GPUs are materially busy at once.
    parallel:
    - zone-huerstholz-auto-a
    - zone-huerstholz-auto-b
    - zone-huerstholz-standard-a
    - zone-huerstholz-standard-b
    - zone-struktur28-auto-a
    - zone-struktur28-auto-b
    - zone-struktur28-standard-a
    - zone-struktur28-standard-b
    - zone-toro-auto-a
    - zone-toro-auto-b
    - zone-toro-standard-a
    - zone-toro-standard-b
    - zone-valiant-auto-a
    - zone-valiant-auto-b
    - zone-valiant-standard-a
    - zone-valiant-standard-b
    maxConcurrency: '{{config.max_concurrency}}'
    next: join
  zone-huerstholz-auto-a:
    description: 'Zone huerstholz-auto-a: full real NuRec/NRE reconstruction of the huerstholz auto capture
      (view sector a) on its own RTX PRO 6000, then novel-view render + Rerun recording.'
    resources: gpu
    params:
      zone_name: huerstholz-auto-a
      scene: huerstholz
      variant: auto
      view_sector: a
      rig_rotation_offset: 0,0,0
      rig_translation_offset: 0,0.25,0
    run:
      shell: "set -euo pipefail\nZONE=\"{{config.zone_name}}\"\nRUN_URI=\"{{config.run_prefix_uri}}\"\n\
        ZU=\"${RUN_URI}zones/${ZONE}/\"\nNC=\"${ZU}ncore/\"\nRC=\"${ZU}reconstruction/\"\nNV=\"${ZU}novel_views/\"\
        \nINPUT=\"${ZU}input/\"\nRRD=\"${ZU}reports/sim2real.rrd\"\nFINAL=\"${ZU}reports/final.json\"\n\
        MF=\"${ZU}zone_manifest.json\"\n\n# ---- runtime setup inside the NRE container --------------------------------\n\
        # The NGC NRE image ships no npa, no ffmpeg, and none of the workbench's Python\n# deps. The runtime\
        \ setup installs npa from $NPA_SRC_S3_URI; this step fills in\n# the NRE-runtime Python deps (nvidia-ncore\
        \ for fetch, rerun-sdk for the Rerun\n# recording, pillow/pyyaml for the join inputs) and ffmpeg\
        \ (backs render\n# --export-video). It is idempotent and matches the shipped single-pod reference.\n\
        export DEBIAN_FRONTEND=noninteractive\nif ! command -v ffmpeg >/dev/null 2>&1; then\n  apt-get\
        \ update -qq || true\n  apt-get install -y -qq --no-install-recommends ffmpeg || true\nfi\nnpa_pip()\
        \ {\n  python3 -m pip install -q \"$@\" || python3 -m pip install -q \"$@\" --break-system-packages\
        \ || python3 -m pip install -q \"$@\" --user\n}\nnpa_pip \"boto3>=1.34\" \"awscli>=1.32\" \"huggingface_hub>=0.30\"\
        \ \"nvidia-ncore\" \"rerun-sdk\" \"pillow>=10.0\" \"pyyaml>=6.0\"\ncommand -v npa >/dev/null 2>&1\
        \ || { echo \"npa not found; set NPA_SRC_S3_URI\" >&2; exit 1; }\n\n# Export the shell vars the\
        \ manifest writer (a child python process) needs.\nexport ZONE RUN_URI ZU NC RC NV INPUT RRD FINAL\
        \ MF\nGPU_NAME=$(nvidia-smi --query-gpu=name --format=csv,noheader | head -1 || echo unknown)\n\
        export GPU_NAME\nSTART=$(date +%s)\nexport START\n\necho \"=== zone $ZONE: check (container +\
        \ dataset rights + RT-core GPU) ===\"\nnpa workbench nurec check --require-gpu --output json\n\
        \necho \"=== zone $ZONE: fetch real NCore V4 shards + derived rig pose edge ===\"\nnpa workbench\
        \ nurec fetch --output-uri \"${NC}\" --output json >/tmp/nurec-fetch.json\nNCORE_JSON=$(python3\
        \ -c \"import json;print(json.load(open('/tmp/nurec-fetch.json'))['ncore_json'])\")\nPOSES_GROUP=$(python3\
        \ -c \"import json;print(json.load(open('/tmp/nurec-fetch.json'))['poses_component_group'])\"\
        )\nCAMERA=$(python3 -c \"import json;print(json.load(open('/tmp/nurec-fetch.json'))['reference_camera'])\"\
        )\ntest -n \"${NCORE_JSON}\" && test -n \"${POSES_GROUP}\" && test -n \"${CAMERA}\"\nexport NCORE_JSON\
        \ POSES_GROUP CAMERA\n\necho \"=== zone $ZONE: reconstruct (3DGUT Gaussians -> renderable USDZ)\
        \ ===\"\nnpa workbench nurec reconstruct --ncore-json \"${NCORE_JSON}\" --poses-component-group\
        \ \"${POSES_GROUP}\" --camera-id \"${CAMERA}\" --world-size 1 --export-gt --output-uri \"${RC}\"\
        \ --input-uri \"${INPUT}\" --output json >/tmp/nurec-reconstruct.json\nUSDZ=$(python3 -c \"import\
        \ json;print(json.load(open('/tmp/nurec-reconstruct.json'))['usdz_path'])\")\ntest -n \"${USDZ}\"\
        \nexport USDZ\n\necho \"=== zone $ZONE: render novel views (rig-offset, not training views) ===\"\
        \nnpa workbench nurec render --artifact-path \"${USDZ}\" --output-dir /tmp/render-out --camera-id\
        \ \"${CAMERA}\" --renderer default --rig-translation-offset \"{{config.rig_translation_offset}}\"\
        \ --rig-rotation-offset \"{{config.rig_rotation_offset}}\" --no-replicate-training-views --output-uri\
        \ \"${NV}\" --output json >/tmp/nurec-render.json\n\necho \"=== zone $ZONE: visualize (reports/sim2real.rrd\
        \ for the agent panel) ===\"\nnpa workbench nurec visualize --input-uri \"${ZU}\" --output-uri\
        \ \"${RRD}\" --output json >/tmp/nurec-viz.json\n\necho \"=== zone $ZONE: finalize (reports/final.json)\
        \ ===\"\nnpa workbench nurec finalize --input-uri \"${ZU}\" --output-uri \"${FINAL}\" --run-id\
        \ \"${ZONE}\" --output json >/tmp/nurec-final.json\n\nEND=$(date +%s)\nexport END\n\npython3 -\
        \ <<'PY'\nimport json, os\ndef _load_json(path, default=None):\n    default = default if default\
        \ is not None else {}\n    try:\n        with open(path) as fh:\n            return json.load(fh)\n\
        \    except Exception:\n        return default\nrecon = _load_json(\"/tmp/nurec-reconstruct.json\"\
        )\nfinal = _load_json(\"/tmp/nurec-final.json\")\nmetrics = recon.get(\"metrics\") or {}\npayload\
        \ = {\n  \"schema\": \"npa.living_lab.zone_manifest.v1\",\n  \"zone_name\": os.environ[\"ZONE\"\
        ],\n  \"status\": \"ok\",\n  \"gpu_name\": os.environ.get(\"GPU_NAME\", \"\"),\n  \"usdz_path\"\
        : os.environ.get(\"USDZ\", \"\"),\n  \"reconstruction_uri\": os.environ.get(\"RC\", \"\"),\n \
        \ \"novel_views_uri\": os.environ.get(\"NV\", \"\"),\n  \"rrd_uri\": os.environ.get(\"RRD\", \"\
        \"),\n  \"final_report_uri\": os.environ.get(\"FINAL\", \"\"),\n  \"elapsed_seconds\": int(os.environ.get(\"\
        END\", 0)) - int(os.environ.get(\"START\", 0)),\n  \"metrics\": {\n    \"test/psnr\": metrics.get(\"\
        test/psnr\", 0.0),\n    \"test/ssim\": metrics.get(\"test/ssim\", 0.0),\n    \"test/lpips\": metrics.get(\"\
        test/lpips\", 0.0),\n  },\n  \"finalize\": {\n    \"status\": final.get(\"status\", \"\"),\n \
        \   \"has_usdz\": bool(final.get(\"has_usdz\", False)),\n    \"has_rrd\": bool(final.get(\"has_rrd\"\
        , False)),\n    \"artifact_count\": final.get(\"artifact_count\", 0),\n  },\n}\njson.dump(payload,\
        \ open(\"/tmp/zone_manifest.json\", \"w\"))\nfrom npa.clients.storage import StorageClient\nStorageClient.from_environment().upload_file(\"\
        /tmp/zone_manifest.json\", os.environ[\"MF\"])\nprint(json.dumps(payload))\nPY\n"
    outputs:
    - uri: '{{config.zones_uri}}{{config.zone_name}}/zone_manifest.json'
      schema: npa.living_lab.zone_manifest.v1
  zone-huerstholz-auto-b:
