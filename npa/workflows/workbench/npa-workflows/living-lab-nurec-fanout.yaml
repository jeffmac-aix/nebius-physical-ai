        \ manifest writer (a child python process) needs.\nexport ZONE RUN_URI ZU NC RC NV INPUT RRD FINAL\
        \ MF\nGPU_NAME=$(nvidia-smi --query-gpu=name --format=csv,noheader | head -1 || echo unknown)\n\
        export GPU_NAME\nSTART=$(date +%s)\nexport START\n\necho \"=== zone $ZONE: check (container +\
