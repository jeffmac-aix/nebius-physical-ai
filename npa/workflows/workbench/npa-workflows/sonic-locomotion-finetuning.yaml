apiVersion: npa.workflow/v0.0.1
kind: Workflow

metadata:
  name: sonic-locomotion-finetuning
  description: Retarget motion, train SONIC, then score with MJLab.
  skypilotTwin: npa/src/npa/workflows/skypilot/sonic-locomotion-finetuning.yaml

config:
  bucket: example-bucket
  prefix: "runs/{{run.id}}/sonic-locomotion"
  embodiment: unitree-g1
  source_format: auto
  # in-job, not serverless: a stage is already running on a GPU the workflow engine
  # provisioned. Asking the in-pod CLI to provision a Nebius Job from there fails with
  # "--runtime serverless requires --project-id" and, given one, would have the workflow
  # launch infrastructure the engine is already responsible for (EVIDENCE.md §R42).
  sonic_runtime: in-job
  # NVIDIA's Omniverse / Isaac Sim / Software licence terms. `--runtime in-job` downloads Isaac
  # Sim and Isaac Lab onto the machine, and the SONIC entrypoint refuses until this is given.
  # Empty means NOT accepted; set it to --accept-nvidia-eula to accept.
  sonic_accept_nvidia_eula: ""
  suite: locomotion
  episodes: "8"
  checkpoint_uri: "nvidia/GEAR-SONIC"
  data_uri: "s3://{{config.bucket}}/{{config.prefix}}/data/"

  motion_uri: "s3://{{config.bucket}}/{{config.prefix}}/source/"
  retargeted_uri: "s3://{{config.bucket}}/{{config.prefix}}/retargeted/"
  training_uri: "s3://{{config.bucket}}/{{config.prefix}}/training/"
  mjlab_uri: "s3://{{config.bucket}}/{{config.prefix}}/mjlab/"

resources:
  cpu:
    cloud: kubernetes
    cpus: 4
    memory: 16Gi
  gpu:
    cloud: kubernetes
    accelerators: H100:1
    cpus: 16
    memory: 80Gi

initial: retarget

states:
  retarget:
    description: Retarget source motion into the SONIC embodiment schema.
    toolRef: workbench.retargeting.run
    resources: cpu
    outputs:
      - uri: "{{config.retargeted_uri}}retargeting_result.json"
    next: train

  train:
    description: Train or smoke-validate a SONIC locomotion policy.
    needs: [retarget]
    toolRef: workbench.sonic.train
    resources: gpu
    outputs:
      - uri: "s3://{{config.bucket}}/{{config.prefix}}/checkpoint.json"
    next: mjlab

  mjlab:
    description: Score the trained checkpoint with MJLab metrics.
    needs: [train]
    toolRef: workbench.mjlab.eval
    resources: gpu
    outputs:
      - uri: "{{config.mjlab_uri}}mjlab_eval.json"
    terminal: true
