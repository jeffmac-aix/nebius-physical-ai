version: 1
readiness:
  required_evidence:
    - supported_api_state
    - application_health
    - camera_frames
    - finite_action_chunk
    - safe_target_application
  insufficient_evidence:
    - process_exists
    - pid_exists
    - tcp_listener_exists
    - tunnel_connected
    - gpu_assigned
policy_boundary:
  service:
    exposure: cluster_ip
    port: 8000
  action_shape: [15, 8]
  finite: true
  fail_closed: true
  no_action_on:
    - timeout
    - malformed_response
    - wrong_shape
    - non_finite
    - joint_limit
    - rate_limit
    - reconnect_exhausted
secret_scopes:
  model_entitlement: cache_warmer_only
  model_cache_writer: cache_warmer_only
  model_cache_reader: policy_server_read_only
  antioch_session: simulator_only
  isaac_acceptance: simulator_only
  simulator_model_entitlement: forbidden
  policy_antioch_session: forbidden
public_artifacts:
  prohibited_payloads:
    - credentials
    - customer_data
    - live_infrastructure_identifiers
    - ssh_identity
    - antioch_local_state
    - model_weights
    - populated_model_cache
    - nvidia_isaac
    - proprietary_isaac_lab
    - omniverse_kit
    - driver_userspace
cleanup:
  scope: exact_run_resources_only
  order:
    - cancel_exact_run
    - wait_terminal
    - stop_exact_services
    - release_exact_machine
